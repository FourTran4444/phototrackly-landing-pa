name: Verify Next.js app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      EARLY_ACCESS_WEBHOOK_URL: ''
      EARLY_ACCESS_WEBHOOK_TOKEN: ''
      NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          node --version
          npm --version
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Domain model tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser and API tests
        run: npm run test:e2e
      - name: Prepare source bundle
        if: always()
        run: |
          mkdir -p artifacts
          tar --exclude=.git --exclude=node_modules --exclude=.next --exclude=artifacts --exclude=playwright-report --exclude=test-results --exclude='*.tsbuildinfo' -czf artifacts/phototrackly-nextjs-source.tar.gz .
      - name: Save reports, rendered screens, and source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phototrackly-verification-${{ github.run_number }}
          path: |
            artifacts/
            playwright-report/
            test-results/
            package-lock.json
          retention-days: 14
