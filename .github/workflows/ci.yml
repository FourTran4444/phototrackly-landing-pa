name: Verify Next.js app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      EARLY_ACCESS_WEBHOOK_URL: ''
      EARLY_ACCESS_WEBHOOK_TOKEN: ''
      NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        id: install
        run: |
          node --version
          npm --version
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: TypeScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Domain model tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:unit
      - name: Production build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Install test browser
        id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install --with-deps chromium
      - name: Browser and API tests
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run test:e2e
      - name: Prepare source bundle
        if: always()
        run: |
          mkdir -p artifacts
          tar --exclude=.git --exclude=node_modules --exclude=.next --exclude=artifacts --exclude=playwright-report --exclude=test-results --exclude='*.tsbuildinfo' -czf artifacts/phototrackly-nextjs-source.tar.gz .
      - name: Save reports, rendered screens, and source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phototrackly-verification-${{ github.run_number }}
          path: |
            artifacts/
            playwright-report/
            test-results/
            package-lock.json
          retention-days: 14

  # One-time bootstrap: commit only the exact lockfile that passed verification.
  # The build/test job has no write token. Existing lockfiles are never changed here.
  initial-lockfile:
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phototrackly-verification-${{ github.run_number }}
          path: ${{ runner.temp }}/verified-phototrackly
      - name: Commit the initial verified dependency lockfile
        env:
          VERIFIED_FILES: ${{ runner.temp }}/verified-phototrackly
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'A dependency lockfile is already tracked; nothing to change.'
            exit 0
          fi
          cp "$VERIFIED_FILES/package-lock.json" package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'build: lock dependencies verified by the full test suite'
          # Non-force push refuses to overwrite concurrent changes to main.
          git push origin HEAD:main
