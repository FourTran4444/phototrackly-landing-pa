name: Verify PhotoTrackly
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: phototrackly_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
      LEAD_STORAGE: sqlite
      LEAD_TOKEN_SECRET: 'isolated-ci-only-secret-never-use-in-production'
      DATABASE_URL: 'postgresql://postgres:ci-only-password@localhost:5432/phototrackly_test'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated lead storage
        run: echo "LEAD_DATA_DIRECTORY=$RUNNER_TEMP/phototrackly-leads" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: TypeScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Domain and persistent lead tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:unit
      - name: PostgreSQL migration and permissions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create role service_role;'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202609230001_early_access.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/lead-postgres.sql
      - name: Production build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Install test browser
        id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install --with-deps chromium
      - name: Browser and API tests
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run test:e2e
      - name: Prepare source bundle
        if: always()
        run: |
          mkdir -p artifacts
          tar --exclude=.git --exclude=node_modules --exclude=.next --exclude=artifacts --exclude=playwright-report --exclude=test-results --exclude='*.tsbuildinfo' --exclude='*.sqlite*' --exclude='.env.local' -czf artifacts/phototrackly-nextjs-source.tar.gz .
      - name: Save verification reports and rendered pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phototrackly-verification-${{ github.run_number }}
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 14
