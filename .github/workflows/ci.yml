name: Verify PhotoTrackly
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: TypeScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Domain and Google receiver tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:unit
      - name: Production build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Install test browser
        id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install --with-deps chromium
      - name: Browser and API tests
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: |
          export LEAD_WEBHOOK_URL='https://script.google.com/macros/s/phototrackly-test-only/exec'
          export LEAD_WEBHOOK_SECRET='test-only-google-webhook-secret-never-deploy'
          export PHOTOTRACKLY_TEST_SHEET_FILE="$RUNNER_TEMP/phototrackly-test-sheet.json"
          export NODE_OPTIONS="--import=$PWD/tests/helpers/mock-google.mjs"
          npm run test:e2e
      - name: Prepare source bundle
        if: always()
        run: |
          mkdir -p artifacts
          tar --exclude=.git --exclude=node_modules --exclude=.next --exclude=artifacts --exclude=playwright-report --exclude=test-results --exclude='*.tsbuildinfo' --exclude='*.sqlite*' --exclude='.env.local' -czf artifacts/phototrackly-nextjs-source.tar.gz .
      - name: Save verification reports and rendered pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phototrackly-verification-${{ github.run_number }}
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 14
